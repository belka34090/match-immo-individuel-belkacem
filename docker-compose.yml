services:
  postgres:
    image: postgres:16
    container_name: match-immo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - match-immo-postgres-data:/var/lib/postgresql/data

volumes:
  match-immo-postgres-data:
