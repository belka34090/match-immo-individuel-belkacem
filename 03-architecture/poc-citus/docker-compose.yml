services:

  coordinator:
    image: citusdata/citus:14.2.0-pg16
    container_name: matchimmo-citus-coordinator
    environment:
      POSTGRES_USER: ${CITUS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CITUS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITUS_POSTGRES_DB}
    ports:
      - "${CITUS_COORDINATOR_PORT:-55432}:5432"
    volumes:
      - coordinator-data:/var/lib/postgresql/data

  worker1:
    image: citusdata/citus:14.2.0-pg16
    container_name: matchimmo-citus-worker1
    environment:
      POSTGRES_USER: ${CITUS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CITUS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITUS_POSTGRES_DB}
    volumes:
      - worker1-data:/var/lib/postgresql/data

  worker2:
    image: citusdata/citus:14.2.0-pg16
    container_name: matchimmo-citus-worker2
    environment:
      POSTGRES_USER: ${CITUS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CITUS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITUS_POSTGRES_DB}
    volumes:
      - worker2-data:/var/lib/postgresql/data

volumes:
  coordinator-data:
  worker1-data:
  worker2-data:
